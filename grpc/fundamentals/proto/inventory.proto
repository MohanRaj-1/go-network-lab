
syntax = "proto3";

package inventory.v1;

option go_package = "github.com/MohanRaj-1/go-network-lab/grpc/fundamentals/proto;inventorypb";

service InventoryService {
  rpc CheckStock (StockRequest) returns (StockResponse);
  rpc ListStock(StockListRequest) returns (stream StockItem);
  rpc ReportStock(stream StockItem) returns (StockReportResponse);
}

message StockRequest {
  string product_id = 1;
}

message StockResponse {
  bool available = 1;
}

message StockListRequest {}

message StockItem {
  string product_id = 1;
  bool available = 2;
}

message StockReportResponse {
  int32 received_count = 1;
  int32 available_count = 2;
}
